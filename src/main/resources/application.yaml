spring:
  application:
    name: urlshortener

  datasource:
    url: jdbc:mysql://localhost:3306/urlshortener
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080